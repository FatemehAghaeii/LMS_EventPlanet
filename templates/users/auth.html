<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود و ثبت‌نام | LMS EventPlanet</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <div class="flex justify-around mb-6 border-b pb-2">
            <button id="tabSignUp" class="text-lg font-bold text-blue-600 border-b-2 border-blue-600 pb-1 focus:outline-none" onclick="switchMode('signup')">ورود (Sign Up)</button>
            <button id="tabSignIn" class="text-lg font-bold text-gray-400 pb-1 focus:outline-none" onclick="switchMode('signin')">ثبت‌نام (Sign In)</button>
        </div>
        
        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">نام کاربری</label>
                <input type="text" id="username" required class="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">کلمه عبور</label>
                <input type="password" id="password" required class="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            
            <div id="roleField" class="hidden">
                <label class="block text-sm font-medium text-gray-700">نقش کاربری</label>
                <select id="role" class="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="PARTICIPANT">دانشجو / شرکت کننده</option>
                    <option value="ORGANIZER">استاد / برگزار کننده</option>
                </select>
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 transition font-medium">
                ورود (Sign Up)
            </button>
        </form>
        
        <p id="message" class="mt-4 text-center text-sm font-semibold"></p>
    </div>

    <script>
        let currentMode = 'signup'; // حالت پیش‌فرض روی ورود (Sign Up) است

        function switchMode(mode) {
            currentMode = mode;
            const tabSignUp = document.getElementById('tabSignUp');
            const tabSignIn = document.getElementById('tabSignIn');
            const roleField = document.getElementById('roleField');
            const submitBtn = document.getElementById('submitBtn');
            const messageEl = document.getElementById('message');
            
            messageEl.innerText = ""; // پاک کردن پیام‌های قبلی

            if (mode === 'signup') {
                // حالت ورود
                tabSignUp.className = "text-lg font-bold text-blue-600 border-b-2 border-blue-600 pb-1 focus:outline-none";
                tabSignIn.className = "text-lg font-bold text-gray-400 pb-1 focus:outline-none";
                roleField.classList.add('hidden'); // فیلد نقش مخفی می‌شود
                submitBtn.innerText = "ورود (Sign Up)";
            } else {
                // حالت ثبت‌نام
                tabSignIn.className = "text-lg font-bold text-blue-600 border-b-2 border-blue-600 pb-1 focus:outline-none";
                tabSignUp.className = "text-lg font-bold text-gray-400 pb-1 focus:outline-none";
                roleField.classList.remove('hidden'); // فیلد نقش ظاهر می‌شود
                submitBtn.innerText = "ثبت‌نام (Sign In)";
            }
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const messageEl = document.getElementById('message');

            // تشخیص آدرس API بر اساس حالتی که کاربر انتخاب کرده
            const apiUrl = currentMode === 'signup' ? '/api/auth/sign-up/' : '/api/auth/sign-in/';

            const bodyData = { username, password };
            if (currentMode === 'signin') {
                bodyData.role = role;
            }

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const data = await response.json();
                
                if (response.ok) {
                    messageEl.className = "mt-4 text-center text-sm font-semibold text-green-600";
                    if (currentMode === 'signin') {
                        messageEl.innerText = "ثبت‌نام با موفقیت انجام شد! حالا می‌توانید وارد شوید.";
                        setTimeout(() => switchMode('signup'), 1500); // انتقال خودکار به فرم ورود
                    } else {
                        messageEl.innerText = "ورود موفقیت‌آمیز بود! نقش شما: " + data.role;
                        localStorage.setItem('token', data.token); // ذخیره توکن در مرورگر
                    }
                } else {
                    messageEl.className = "mt-4 text-center text-sm font-semibold text-red-600";
                    messageEl.innerText = "خطا: " + (data.non_field_errors ? "نام کاربری یا رمز عبور اشتباه است." : JSON.stringify(data));
                }
            } catch (error) {
                console.error(error);
                messageEl.innerText = "خطا در اتصال به سرور!";
            }
        });
    </script>
</body>
</html>

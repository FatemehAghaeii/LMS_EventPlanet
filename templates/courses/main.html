<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مدیریت دوره‌ها | LMS EventPlanet</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center bg-white p-6 rounded-lg shadow-md mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">داشبورد دوره‌های آموزشی</h1>
                <p class="text-sm text-gray-500 mt-1">خوش آمدید! وضعیت سیستم: <span id="userRole" class="font-bold text-blue-600">کد کاربری فعال</span></p>
            </div>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 transition text-sm">خروج</button>
        </div>

        <div id="createCourseSection" class="bg-white p-6 rounded-lg shadow-md mb-6 hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">➕ ایجاد دوره جدید (مخصوص اساتید)</h2>
            <form id="courseForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">عنوان دوره</label>
                    <input type="text" id="title" required class="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">ظرفیت (نفر)</label>
                    <input type="number" id="capacity" required class="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">قیمت (تومان)</label>
                    <input type="number" id="price" required class="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">توضیحات دوره</label>
                    <textarea id="description" rows="3" required class="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-green-600 text-white p-2 rounded-md hover:bg-green-700 transition font-medium">ثبت و انتشار دوره</button>
                </div>
            </form>
            <p id="formMessage" class="mt-3 text-center text-sm font-semibold"></p>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">📚 لیست دوره‌های فعال</h2>
            <div id="coursesList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/';
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadUserProfileAndCourses();
        });

        async function loadUserProfileAndCourses() {
            try {
                await loadCourses();
                // فرم رو جهت تست باز نگه می‌داریم، بک‌اند امنیتش رو بررسی می‌کنه
                document.getElementById('createCourseSection').classList.remove('hidden');
            } catch (error) {
                console.error(error);
            }
        }

        async function loadCourses() {
            try {
                const response = await fetch('/api/courses/', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Token ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const courses = await response.json();
                const container = document.getElementById('coursesList');
                container.innerHTML = '';

                if (courses.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 col-span-2 text-center py-4">هیچ دوره‌ای تا کنون ثبت نشده است.</p>';
                }

                courses.forEach(course => {
                    container.innerHTML += `
                        <div class="border p-4 rounded-lg bg-gray-50 hover:shadow-sm transition">
                            <h3 class="text-lg font-bold text-gray-800">${course.title}</h3>
                            <p class="text-sm text-gray-600 mt-1 h-12 overflow-hidden">${course.description}</p>
                            <div class="mt-4 flex justify-between items-center text-xs text-gray-500 border-t pt-2">
                                <span>👨‍🏫 مدرس: ${course.instructor_name}</span>
                                <span>👥 ظرفیت: ${course.capacity} نفر</span>
                            </div>
                            <div class="mt-2 text-left">
                                <span class="text-sm font-bold text-green-600">${parseFloat(course.price) === 0 ? 'رایگان' : parseFloat(course.price).toLocaleString() + ' تومان'}</span>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error(error);
            }
        }

        document.getElementById('courseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const capacity = document.getElementById('capacity').value;
            const price = document.getElementById('price').value;
            const description = document.getElementById('description').value;
            const messageEl = document.getElementById('formMessage');

            try {
                const response = await fetch('/api/courses/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, capacity, price, description })
                });

                const data = await response.json();

                if (response.ok) {
                    messageEl.className = "mt-3 text-center text-sm font-semibold text-green-600";
                    messageEl.innerText = "دوره با موفقیت ساخته و منتشر شد! 🎉";
                    document.getElementById('courseForm').reset();
                    loadCourses(); 
                } else {
                    messageEl.className = "mt-3 text-center text-sm font-semibold text-red-600";
                    messageEl.innerText = data.detail ? data.detail : "خطا: فقط اساتید مجاز به ساخت دوره هستند یا داده‌ها نامعتبرند.";
                }
            } catch (error) {
                messageEl.innerText = "خطا در اتصال به سرور!";
            }
        });

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }
    </script>
</body>
</html>
